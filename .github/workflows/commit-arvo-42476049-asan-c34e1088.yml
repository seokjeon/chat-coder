name: Commit ARVO 42476049 ASan logs c34e1088

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commit-arvo-42476049-asan-c34e1088.yml'

permissions:
  contents: write

jobs:
  commit-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract ASan crash output and stack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sqlite3

          arvo_id = 42476049
          crash_output = None

          for db_path in ("arvo-1.db", "arvo-2.db"):
              con = sqlite3.connect(f"file:{db_path}?mode=ro", uri=True)
              try:
                  row = con.execute(
                      "SELECT crash_output FROM arvo WHERE localId = ?",
                      (arvo_id,),
                  ).fetchone()
              finally:
                  con.close()
              if row is not None:
                  crash_output = row[0] or ""
                  break

          if crash_output is None:
              raise SystemExit(f"ARVO ID {arvo_id} not found")

          out_dir = pathlib.Path("analysis/arvo-42476049")
          out_dir.mkdir(parents=True, exist_ok=True)

          raw_path = out_dir / "asan-crash-output.txt"
          raw_path.write_text(crash_output, encoding="utf-8")

          ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          clean = ansi.sub("", crash_output)
          selected = []
          for line in clean.splitlines():
              stripped = line.strip()
              if (
                  "ERROR: AddressSanitizer:" in line
                  or re.search(r"\b(?:READ|WRITE) of size \d+\b", line)
                  or stripped.startswith("SCARINESS:")
                  or re.match(r"^#\d+\s+", stripped)
                  or "SUMMARY: AddressSanitizer:" in line
              ):
                  selected.append(stripped)

          if not selected:
              raise SystemExit("No ASan stack lines found in crash_output")

          stack_path = out_dir / "asan-stack.txt"
          stack_path.write_text("\n".join(selected) + "\n", encoding="utf-8")

          print(f"raw_bytes={raw_path.stat().st_size}")
          print(f"stack_lines={len(selected)}")
          print("=== ASAN STACK ===")
          print(stack_path.read_text(encoding="utf-8"))
          PY

      - name: Commit extracted logs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/arvo-42476049/asan-crash-output.txt analysis/arvo-42476049/asan-stack.txt
          git diff --cached --check
          git commit -m "Add ARVO 42476049 ASan crash log"
          git push origin HEAD:main
