name: ARVO SQL analysis

on:
  issues:
    types:
      - edited

permissions:
  contents: read

jobs:
  query:
    if: ${{ github.event.issue.number == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SQL
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.issue.body' "$GITHUB_EVENT_PATH" > query.sql
          echo "=== SQL ==="
          cat query.sql

      - name: Query combined ARVO databases
        shell: bash
        run: |
          set -euo pipefail
          cat > init.sql <<'SQL'
          .headers on
          .mode column
          ATTACH 'file:arvo-1.db?mode=ro' AS a1;
          ATTACH 'file:arvo-2.db?mode=ro' AS a2;
          CREATE TEMP VIEW arvo AS
            SELECT * FROM a1.arvo
            UNION ALL
            SELECT * FROM a2.arvo;
          .read query.sql
          SQL
          echo "=== RESULT ==="
          sqlite3 ':memory:' < init.sql
