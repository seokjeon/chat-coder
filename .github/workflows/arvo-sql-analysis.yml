name: ARVO SQL analysis

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "Read-only SQL to run against the combined ARVO dataset"
        required: true
        type: string
  issues:
    types: [edited]

permissions:
  contents: read
  issues: read

jobs:
  query:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.number == 1 && github.event.issue.title == 'ARVO SQL runner')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SQL
        shell: bash
        env:
          DISPATCH_SQL: ${{ inputs.sql }}
          ISSUE_SQL: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s
' "$DISPATCH_SQL" > query.sql
          else
            printf '%s
' "$ISSUE_SQL" > query.sql
          fi
          echo "=== SQL ==="
          cat query.sql

      - name: Query combined ARVO databases
        shell: bash
        run: |
          set -euo pipefail
          cat > init.sql <<'SQL'
          .headers on
          .mode column
          ATTACH 'file:arvo-1.db?mode=ro' AS a1;
          ATTACH 'file:arvo-2.db?mode=ro' AS a2;
          CREATE TEMP VIEW arvo AS
            SELECT * FROM a1.arvo
            UNION ALL
            SELECT * FROM a2.arvo;
          .read query.sql
          SQL
          echo "=== RESULT ==="
          sqlite3 ':memory:' < init.sql
