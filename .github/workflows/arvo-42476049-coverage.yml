name: ARVO 42476049 coverage analysis

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arvo-42476049-coverage.yml
  issues:
    types:
      - edited

jobs:
  cache-image:
    if: ${{ github.event_name == 'push' || github.event.issue.number == 2 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: n132/arvo:42476049-vul
      CACHE_FILE: /home/runner/.cache/arvo-images/42476049-vul.tar.zst
      CACHE_KEY: arvo-docker-42476049-vul-v1
      MAX_BYTES: "8589934592"
    steps:
      - name: Restore Docker image cache
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/arvo-images/42476049-vul.tar.zst
          key: ${{ env.CACHE_KEY }}

      - name: Pull and cache image on miss
        if: steps.image-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$CACHE_FILE")"
          docker pull "$IMAGE"
          docker save "$IMAGE" | zstd -T0 -3 -o "$CACHE_FILE"
          bytes="$(stat -c %s "$CACHE_FILE")"
          echo "cached_bytes=$bytes"
          awk -v b="$bytes" 'BEGIN { printf("cached_GiB=%.3f\n", b/1073741824) }'
          if [ "$bytes" -ge "$MAX_BYTES" ]; then
            rm -f "$CACHE_FILE"
            echo "Compressed docker-save is >= 8 GiB; refusing to cache." >&2
            exit 1
          fi
          sha256sum "$CACHE_FILE"

      - name: Verify cached image file
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CACHE_FILE"
          bytes="$(stat -c %s "$CACHE_FILE")"
          if [ "$bytes" -ge "$MAX_BYTES" ]; then
            echo "Cached file is >= 8 GiB." >&2
            exit 1
          fi
          awk -v b="$bytes" 'BEGIN { printf("cache_size_GiB=%.3f\n", b/1073741824) }'
          sha256sum "$CACHE_FILE"

  coverage:
    needs: cache-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: n132/arvo:42476049-vul
      CACHE_FILE: /home/runner/.cache/arvo-images/42476049-vul.tar.zst
      CACHE_KEY: arvo-docker-42476049-vul-v1
      FUZZ_TARGET: ares_parse_reply_fuzzer
    steps:
      - name: Restore cached Docker image
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/arvo-images/42476049-vul.tar.zst
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Load Docker image
        shell: bash
        run: |
          set -euo pipefail
          zstd -dc "$CACHE_FILE" | docker load
          docker image inspect "$IMAGE" --format 'loaded={{.RepoTags}} size={{.Size}}'

      - name: Rebuild with coverage and generate llvm-cov show
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage-result

          docker run --name arvo-coverage             -e SANITIZER=coverage             -e LLVM_PROFILE_FILE=/tmp/arvo-%p.profraw             "$IMAGE"             bash -lc '
              set -euo pipefail
              echo "=== toolchain ==="
              command -v arvo
              command -v llvm-cov
              command -v llvm-profdata
              llvm-cov --version | head -n 1
              echo "SANITIZER=$SANITIZER"
              echo "FUZZING_ENGINE=${FUZZING_ENGINE:-}"
              echo "OUT=${OUT:-/out}"
              echo "SRC=${SRC:-/src}"

              echo "=== rebuild ==="
              SANITIZER=coverage arvo compile

              echo "=== target ==="
              ls -l "/out/'"$FUZZ_TARGET"'"
              file "/out/'"$FUZZ_TARGET"'"

              echo "=== reproduce under coverage ==="
              set +e
              LLVM_PROFILE_FILE=/tmp/arvo-%p.profraw arvo
              reproduce_rc=$?
              set -e
              echo "arvo_reproduce_exit=$reproduce_rc"

              echo "=== raw profiles ==="
              find /tmp /out -type f -name "*.profraw" -print
              mapfile -t profiles < <(find /tmp /out -type f -name "*.profraw" -print)
              if [ "${#profiles[@]}" -eq 0 ]; then
                echo "No .profraw files were produced." >&2
                exit 20
              fi

              llvm-profdata merge -sparse "${profiles[@]}" -o /tmp/arvo.profdata

              echo "=== llvm-cov show ==="
              llvm-cov show "/out/'"$FUZZ_TARGET"'"                 -instr-profile=/tmp/arvo.profdata                 -show-line-counts=false                 -show-line-counts-or-regions=false                 -show-regions=false                 -show-instantiations=false                 -show-expansions=false                 -use-color=false                 > /tmp/llvm-cov-show.txt

              test -s /tmp/llvm-cov-show.txt
              wc -l /tmp/llvm-cov-show.txt
              sed -n "1,80p" /tmp/llvm-cov-show.txt

              {
                echo "ARVO ID: 42476049"
                echo "Image: n132/arvo:42476049-vul"
                echo "Fuzz target: '"$FUZZ_TARGET"'"
                echo "SANITIZER: coverage"
                echo "arvo reproduce exit: $reproduce_rc"
                echo "llvm-cov options: -show-line-counts=false -show-line-counts-or-regions=false -show-regions=false -show-instantiations=false -show-expansions=false -use-color=false"
              } > /tmp/coverage-metadata.txt
            '

          docker cp arvo-coverage:/tmp/llvm-cov-show.txt coverage-result/llvm-cov-show.txt
          docker cp arvo-coverage:/tmp/coverage-metadata.txt coverage-result/coverage-metadata.txt
          test -s coverage-result/llvm-cov-show.txt

      - name: Upload coverage result
        uses: actions/upload-artifact@v4
        with:
          name: arvo-42476049-llvm-cov
          path: coverage-result/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download coverage result
        uses: actions/download-artifact@v4
        with:
          name: arvo-42476049-llvm-cov
          path: /tmp/arvo-coverage-result

      - name: Commit coverage text
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p analysis/arvo-42476049
          cp /tmp/arvo-coverage-result/llvm-cov-show.txt analysis/arvo-42476049/llvm-cov-show.txt
          cp /tmp/arvo-coverage-result/coverage-metadata.txt analysis/arvo-42476049/coverage-metadata.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/arvo-42476049/llvm-cov-show.txt analysis/arvo-42476049/coverage-metadata.txt

          if git diff --cached --quiet; then
            echo "Coverage output unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "Add ARVO 42476049 llvm-cov output"
          git push origin HEAD:main
